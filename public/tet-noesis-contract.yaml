schema_version: "1.0.0"
name: "TET Noesis"
status: "operational-local-harness"
principle: "Think recursively. Know what is uncertain. Act only with proof."

runtime:
  execution_adapter: "dry_run_only"
  external_tool_calls: false
  network_transmission: false
  storage: "browser_local_storage"
  workspace_key: "founderlab.noesis.workspace.v1"
  import_export: "strict_versioned_json"
  validation: "zod_4"

authority:
  reflection: "proposal_only"
  evidence: "required"
  independent_verifier: "required"
  self_confidence_counts_as_proof: false
  consensus_counts_as_proof: false

state:
  canonical_source_required: true
  uncertainty_must_be_explicit: true
  contradiction_tracking: true

recursion:
  trigger: "blocking_subproblem_only"
  scope: "narrow"
  budget_required: true
  parent_objective_frozen: true

execution:
  capability_lease_required: true
  receipt_required: true
  reversible_by_default: true
  production_requires_human_approval: true
  lease_revoked_after_receipt: true

warrant_policies:
  low:
    minimum_proof_coverage: 0.60
    maximum_uncertainty: 0.40
    independent_verifier_required: false
    human_approval_required: false
  medium:
    minimum_proof_coverage: 0.80
    maximum_uncertainty: 0.25
    independent_verifier_required: true
    human_approval_required: false
  high:
    minimum_proof_coverage: 0.90
    maximum_uncertainty: 0.15
    independent_verifier_required: true
    human_approval_required: true
  critical:
    minimum_proof_coverage: 1.00
    maximum_uncertainty: 0.10
    independent_verifier_required: true
    human_approval_required: true

audit:
  local_event_limit: 200
  local_receipt_limit: 25
  receipt_result: "dry_run_completed"

memory:
  provenance_required: true
  retention_class_required: true
  may_inform_decisions: true
  may_authorize_actions: false

self_improvement:
  live_self_modification: false
  required_stages:
    - sandbox_evaluation
    - protected_tests
    - human_approval
    - canary_release
    - rollback_ready

claims:
  consciousness_claims: false
  self_modeling: "functional_mechanism"
  workspace_coordination: "functional_mechanism"
