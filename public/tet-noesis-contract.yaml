schema_version: "1.0.0"
name: "TET Noesis"
status: "operational-local-harness"
principle: "Think recursively. Know what is uncertain. Act only with proof."

runtime:
  execution_adapter: "dry_run_only"
  external_tool_calls: false
  network_transmission: false
  storage: "browser_local_storage"
  workspace_key: "founderlab.noesis.workspace.v1"
  import_export: "strict_versioned_json"
  validation: "zod_4"

authority:
  reflection: "proposal_only"
  evidence: "required"
  independent_verifier: "required"
  self_confidence_counts_as_proof: false
  consensus_counts_as_proof: false

state:
  canonical_source_required: true
  uncertainty_must_be_explicit: true
  contradiction_tracking: true

recursion:
  trigger: "blocking_subproblem_only"
  scope: "narrow"
  budget_required: true
  parent_objective_frozen: true

execution:
  capability_lease_required: true
  receipt_required: true
  reversible_by_default: true
  production_requires_human_approval: true
  lease_revoked_after_receipt: true

probability_flow:
  schema_version: "0.1.0"
  status: "operational_local_research_harness"
  domains:
    - identity
    - affect
    - liability
    - memory
    - relationship
  forecast_input: "calibrated_summary_not_estimated_by_harness"
  protected_boundary_flux_required: true
  first_passage_exposure_required: true
  tail_risk_required: true
  identity_drift_required: true
  reversibility_required: true
  dependency_closed_effects: true
  partial_authorization: true
  referential_integrity:
    fail_closed: true
    duplicate_references_rejected: true
    observer_dependency_node_namespace_shared: true
    dangling_dependencies_rejected: true
    dependency_node_cycles_rejected: true
    action_cycles_explicitly_reported: true
    relationship_effects_name_both_principals: true
  identity_promotion:
    transient_affect_may_promote: false
    explicit_authority_required: true
    contradictions_must_be_resolved: true
    trust_liabilities_must_be_resolved: true
  witness_reduction:
    dissent_required: true
    negative_evidence_required: true
    rights_coordinates_required: true
    reconstruction_error_bound_required: true
    source_systems:
      personality_interaction_144:
        semantic_equivalent_to_identity_bloom: false
      identity_bloom_12x12:
        semantic_equivalent_to_personality_interaction: false
    validation_status: "research_scaffolding"
  observer_lag:
    increases_uncertainty: true
    transitive_revocation: true
    invalidates:
      - evidence
      - plans
      - certificates
      - leases
      - effects
  care_flow:
    distinct_principals_required: 2
    consent_required: true
    right_to_exit_required: true
    attachment_is_optimization_reward: false
    historical_facts_mutable: false
    interpretations_may_version: true
  receipt:
    complete_lineage_required: true
    local_replay_digest: "fnv1a_64_not_a_signature"
    proof_bundle_version: "0.1.0"
    canonicalization: "ipf-json-sorted-v1"
    receipt_history_in_canonical_input: false
    signed_runtime_adoption_target: "lyzt_governance_microkernel"
    lyzt_wire_owner: "ip/governance-microkernel/transition-payload.ts"
    lyzt_verifier_owner: "server/governance/probability-flow"
    lyzt_public_import_surface: "server/governance/kernel-api"
    lyzt_v3_binding: "sha256_hash_envelope_not_signature"
    lyzt_ed25519_binding:
      signer: "existing_governance_signer_only"
      signed_field_projection_required: true
      derive_after_probability_flow_attachment: true
      leaf_only_extension_is_signed_proof: false
      verifier_recomputes_projection: true
    forbidden_namespace_conflation:
      - "ip/governance-microkernel/tet.ts"
      - "ip/governance-microkernel/tet-bridge.ts"

warrant_policies:
  low:
    minimum_proof_coverage: 0.60
    maximum_uncertainty: 0.40
    independent_verifier_required: false
    human_approval_required: false
  medium:
    minimum_proof_coverage: 0.80
    maximum_uncertainty: 0.25
    independent_verifier_required: true
    human_approval_required: false
  high:
    minimum_proof_coverage: 0.90
    maximum_uncertainty: 0.15
    independent_verifier_required: true
    human_approval_required: true
  critical:
    minimum_proof_coverage: 1.00
    maximum_uncertainty: 0.10
    independent_verifier_required: true
    human_approval_required: true

audit:
  local_event_limit: 200
  local_receipt_limit: 25
  receipt_result: "dry_run_completed"

memory:
  provenance_required: true
  retention_class_required: true
  may_inform_decisions: true
  may_authorize_actions: false

self_improvement:
  live_self_modification: false
  required_stages:
    - sandbox_evaluation
    - protected_tests
    - human_approval
    - canary_release
    - rollback_ready

claims:
  consciousness_claims: false
  self_modeling: "functional_mechanism"
  workspace_coordination: "functional_mechanism"
