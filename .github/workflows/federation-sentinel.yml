name: Federation Sentinel

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Provision pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: ""
      - id: sentinel
        name: Audit exact candidate head
        uses: dvdmrtnz15-afk/SkillAx/sentinel@f8bd8e0f7cba0e1df32691b705f836c8c638bf0a
        with:
          config: .truenorth/sentinel.json
          evidence-path: ${{ runner.temp }}/truenorth-federation-sentinel/sentinel-review-evidence.json
          report-path: ${{ runner.temp }}/truenorth-federation-sentinel/sentinel-report.md
      - name: Upload non-authorizing review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: federation-sentinel-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/truenorth-federation-sentinel/sentinel-review-evidence.json
            ${{ runner.temp }}/truenorth-federation-sentinel/sentinel-report.md
          if-no-files-found: error
          retention-days: 30
